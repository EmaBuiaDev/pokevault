name: Android CI/CD Tests

# I test unitari sono veloci: girano su tutti i branch su cui si lavora
# davvero. `main` e `develop` non sono mai esistiti in questo repo -- il
# default e' `master` -- quindi quei due filtri non facevano partire niente,
# e i branch di versione (R3.1.3 e simili) non combaciavano con nessun
# pattern: si e' lavorato a lungo senza che la CI girasse mai.
on:
  push:
    branches: [ master, 'R*', 'release/**', 'feature/**', 'fix/**', 'claude/**' ]
  pull_request:
    branches: [ master, 'release/**' ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "POKEWALLET_API_KEY=" >> local.properties
          echo "POKEWALLET_PROXY_ENABLED=false" >> local.properties
          echo "POKEWALLET_PROXY_URL=" >> local.properties

      - name: Run Unit Tests
        run: ./gradlew testProdDebugUnitTest --no-daemon --stacktrace

      # La release passa da R8, i test unitari no. Una classe letta da Gson o
      # da Firestore che R8 rinomina o pota esce da una build verde e arriva
      # sul telefono coi campi a null (i codici regalo il 16/09, le mani
      # salvate dell'Hand Simulator il 28/09). Il controllo legge il
      # mapping.txt della release: se una di quelle classi e' stata toccata,
      # fallisce e dice quale -keep aggiungere.
      - name: Verifica R8 sulle classi lette per reflection
        run: ./gradlew :app:verifyR8Reflection --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testProdDebugUnitTest/

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: app/build/test-results/testProdDebugUnitTest/**/*.xml
          check_name: Unit Test Results
