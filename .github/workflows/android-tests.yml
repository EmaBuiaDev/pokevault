name: Android CI/CD Tests

on:
  push:
    branches: [ main, develop, 'release/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Unit & Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "POKETCG_API_KEY=" > local.properties
          echo "POKEWALLET_API_KEY=" >> local.properties
          echo "POKEWALLET_PROXY_ENABLED=false" >> local.properties
          echo "POKEWALLET_PROXY_URL=" >> local.properties

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/test-results/**/*.xml
          check_name: Test Results

      - name: Comment PR with Test Summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testReportsPath = 'app/build/reports/tests';
            
            let comment = '## ✅ Test Results\n\n';
            comment += '- **Unit Tests**: Run automatically\n';
            comment += '- **Instrumented Tests**: Run on Android device/emulator\n';
            comment += '\n📊 Check the artifacts for detailed reports.\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
