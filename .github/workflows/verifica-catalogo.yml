name: Verifica catalogo dal vivo

# Controlla sul worker di produzione che quello che l'app mostra si veda
# davvero: il logo di ogni espansione, le immagini delle carte (3 per set
# scaricate e decodificate, piu' la copertura completa di tutte le carte
# contro l'elenco di R2), le liste delle carte e lo stato dei prezzi.
# Lo script e' pokevault-proxy-worker/scripts/verifica-catalogo-live.mjs.
#
# Non dipende dal codice del ramo: verifica cio' che e' in produzione. Gira
# - ogni giorno alle 07:00 UTC, un'ora dopo catalog-ingest.yml, cosi' un set
#   appena importato viene controllato subito;
# - a ogni push sui rami di versione, come cancello prima di una release;
# - a mano: tab Actions -> questo workflow -> Run workflow.
#
# Il report: la tabella riassuntiva sta nella pagina della run (Summary), la
# galleria con loghi e carte di ogni set nell'artifact `report-catalogo`
# (aprire report.html). Se la run pianificata fallisce, si apre una issue --
# o si commenta quella gia' aperta, per non averne una al giorno.
#
# Richiede il segreto CLOUDFLARE_API_TOKEN (lo stesso di catalog-ingest.yml):
# serve solo a LEGGERE l'elenco di R2 per la copertura completa. Senza, la
# verifica gira lo stesso sul campione e lo segnala come avviso.

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [ 'R*', 'release/**' ]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pokevault-proxy-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verifica catalogo
        id: verifica
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verifica-catalogo-live.mjs --out report-catalogo

      - name: Allega il report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-catalogo
          path: pokevault-proxy-worker/report-catalogo/
          retention-days: 30

      - name: Apri o aggiorna la issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Verifica catalogo: ci sono immagini o loghi che non si vedono"
          BODY_FILE=$(mktemp)
          {
            cat report-catalogo/report.md 2>/dev/null || echo "La verifica non ha prodotto il report: vedi il log della run."
            echo
            echo "Run: $RUN_URL"
          } > "$BODY_FILE"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file "$BODY_FILE"
          fi
