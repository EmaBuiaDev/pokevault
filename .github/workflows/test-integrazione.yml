name: Test di integrazione (collezione e deck)

# Il codice vero dell'app contro un Firebase finto: l'emulatore di Firestore
# e Auth, con le regole di sicurezza di firestore.rules. Prova quello che si
# rompe senza che i test unitari se ne accorgano:
# - aggiungere ed eliminare carte, una o tante, e che numero e valore della
#   collezione salgano e scendano del giusto;
# - le stampe che si sommano, le carte solo-deck che non contano;
# - l'import di un deck dal tasto Importa e da CSV, "in collezione" (il valore
#   sale) e "deck di prova" (non cambia niente);
# - che un utente non possa leggere le carte di un altro;
# - che ogni sigla delle decklist (BLK, PBL, MEG...) porti al set giusto.
#
# I test stanno in app/src/test/java/com/emabuia/pokevault/integration/ e girano
# con Robolectric: niente emulatore Android, pochi minuti su Linux. Nessun dato
# vero viene toccato: il progetto `demo-pokevault` esiste solo nell'emulatore.
# L'import deck legge il catalogo e i prezzi veri dal worker (sola lettura).
#
# Nei test unitari di sempre (android-tests.yml) questi test si saltano da
# soli perche' l'emulatore non c'e'; qui POKEVAULT_EMULATOR_REQUIRED=1 li fa
# fallire se l'emulatore non parte, cosi' una release non passa senza averli
# eseguiti davvero.
#
# Il report: il riepilogo dei test nella pagina della run, il dettaglio di
# ogni test (con l'errore, se fallisce) nell'artifact `report-integrazione`.

on:
  push:
    branches: [ 'R*', 'release/**' ]
  pull_request:
    branches: [ master, 'release/**' ]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write

jobs:
  integrazione:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # L'URL del worker e' pubblico (e' dentro l'APK): serve all'import deck
      # per cercare le carte nel catalogo come fa l'app. Il catalogo italiano
      # (ITALIAN_CATALOG_URL) sta sullo stesso worker: senza, l'import crea le
      # carte senza trovarle.
      POKEVAULT_PROXY_URL: https://pokevault-proxy.pokevault-emanu.workers.dev/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "POKEWALLET_API_KEY=" >> local.properties
          echo "POKEWALLET_PROXY_ENABLED=true" >> local.properties
          echo "POKEWALLET_PROXY_URL=$POKEVAULT_PROXY_URL" >> local.properties
          echo "ITALIAN_CATALOG_URL=${POKEVAULT_PROXY_URL}ita/catalog.json" >> local.properties

      - name: Test di integrazione sull'emulatore Firebase
        env:
          POKEVAULT_EMULATOR_REQUIRED: '1'
          # Solo lettura: SigleDecklistTest legge da D1 le sigle dei set
          # (expansions.upstream_set_code). Stesso segreto di catalog-ingest.yml.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >
          npx -y firebase-tools@13 emulators:exec
          --config firebase.emulators.json
          --only firestore,auth
          --project demo-pokevault
          "./gradlew testProdDebugUnitTest --tests 'com.emabuia.pokevault.integration.*' --no-daemon --stacktrace"

      - name: Riepilogo nella pagina della run
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: app/build/test-results/testProdDebugUnitTest/TEST-com.emabuia.pokevault.integration.*.xml
          check_name: Test di integrazione
          comment_mode: off

      - name: Allega il report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-integrazione
          path: app/build/reports/tests/testProdDebugUnitTest/
          retention-days: 30
