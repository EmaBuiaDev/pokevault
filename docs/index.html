<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeVault</title>
    <link rel="icon" type="image/svg+xml" href="/pokevault/icon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1A1A2E;
            color: #B0B0C0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 480px;
            text-align: center;
        }
        .logo {
            display: block;
            width: 96px;
            height: 96px;
            border-radius: 26px;
            margin: 0 auto 24px;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 12px 40px rgba(139, 92, 246, 0.35);
        }
        h1 {
            color: #FFFFFF;
            font-size: 32px;
            margin-bottom: 8px;
        }
        .tagline {
            color: #6B6B8D;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            display: inline-block;
            background: #232342;
            color: #4A6CF7;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .links a:hover {
            background: #2A2A4A;
        }
        .footer {
            margin-top: 48px;
            font-size: 11px;
            color: #6B6B8D;
        }
    </style>
</head>
<body>
<div class="container">
    <img class="logo" src="/pokevault/icon.svg" alt="PokeVault">

    <h1>PokeVault</h1>
    <p class="tagline">La tua collezione di carte, al sicuro.</p>

    <div class="links">
        <a href="/pokevault/privacy-policy">Privacy Policy</a>
        <a href="/pokevault/terms">Termini di Servizio</a>
        <a href="/pokevault/copyright">Copyright &amp; Takedown</a>
    </div>

    <p class="footer">
        PokeVault non e affiliata a Nintendo, The Pokemon Company o The Pokemon Company International.
    </p>
</div>
</body>
</html>
